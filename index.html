<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME TO A PERSONALIZED EXPERIENCE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Initialize Supabase Client with your credentials
        const SUPABASE_URL = "https://ijojvlhnabdbjsidzdro.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_vQqpMKPHdtaUUoQhiVMJbQ_mNDHSueI";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [view, setView] = useState('home'); // 'home', 'booking', 'admin', 'confirmation'
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPassword, setAdminPassword] = useState(localStorage.getItem('admin_pwd') || 'admin123');
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [bookingDetails, setBookingDetails] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [bookings, setBookings] = useState([]);
            const [loadingBookings, setLoadingBookings] = useState(false);

            // Services State
            const [services, setServices] = useState([
                { id: 'srv-1', name: 'Deep Tissue Therapy', basePrice: 120, active: true, tag: 'Popular' },
                { id: 'srv-2', name: 'Hot Stone & Hot Tub Sessions', basePrice: 160, active: true, tag: 'Luxurious' },
                { id: 'srv-3', name: 'Relaxing Body Rubs', basePrice: 90, active: true, tag: 'Classic' },
                { id: 'srv-4', name: 'Specialty Nuru Massage', basePrice: 180, active: true, tag: 'Exclusive' },
                { id: 'srv-5', name: 'Customized Treatments', basePrice: 150, active: true, tag: 'Bespoke' },
                { id: 'srv-6', name: 'Happy Ending', basePrice: 200, active: true, tag: 'Signature' },
            ]);

            // Multipliers
            const [multipliers, setMultipliers] = useState({ 30: 0.6, 60: 1.0, 90: 1.4, 120: 1.8 });

            // Therapists State
            const [therapists, setTherapists] = useState([
                { id: 't-1', name: 'Sophia Lane', phone: '+1 (555) 234-5678', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', bio: 'Expert in Deep Tissue and therapeutic healing.', active: true },
                { id: 't-2', name: 'Elena Rostova', phone: '+1 (555) 876-5432', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150', bio: 'Specialist in Hot Stone rituals.', active: true },
                { id: 't-3', name: 'Marcus Vance', phone: '+1 (555) 345-6789', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', bio: 'Master of sports recovery manipulation.', active: true }
            ]);

            // Payment Methods State
            const [paymentMethods, setPaymentMethods] = useState([
                { id: 'p-1', name: 'Zelle / Bank Transfer', active: true },
                { id: 'p-2', name: 'Cash App', active: true },
                { id: 'p-3', name: 'Cryptocurrency (USDT/BTC)', active: true },
                { id: 'p-4', name: 'Cash on Arrival', active: true }
            ]);

            // Booking Form State
            const [selectedService, setSelectedService] = useState(services[0]);
            const [duration, setDuration] = useState('60');
            const [selectedTherapist, setSelectedTherapist] = useState(therapists[0]);
            const [fullName, setFullName] = useState('');
            const [phone, setPhone] = useState('');
            const [email, setEmail] = useState('');
            const [address, setAddress] = useState('');
            const [bookingDate, setBookingDate] = useState('');
            const [bookingTime, setBookingTime] = useState('');
            const [paymentMethod, setPaymentMethod] = useState(paymentMethods[0].name);
            const [agreedDeposit, setAgreedDeposit] = useState(false);

            // Fetch real bookings from Supabase
            const fetchBookings = async () => {
                setLoadingBookings(true);
                const { data, error } = await supabase
                    .from('bookings')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('Error fetching bookings:', error);
                } else if (data) {
                    setBookings(data);
                }
                setLoadingBookings(false);
            };

            useEffect(() => {
                if (isAdminLoggedIn) {
                    fetchBookings();
                }
            }, [isAdminLoggedIn]);

            // Calculated pricing
            const currentTotal = useMemo(() => {
                const mult = multipliers[duration] || 1.0;
                return Math.round(selectedService.basePrice * mult);
            }, [selectedService, duration, multipliers]);

            const currentDeposit = useMemo(() => Math.round(currentTotal / 2), [currentTotal]);

            // Submit booking to Supabase database
            const handleBookingSubmit = async (e) => {
                e.preventDefault();
                if (!agreedDeposit) {
                    alert('You must accept the 50% deposit agreement to proceed.');
                    return;
                }

                setIsSubmitting(true);

                const payload = {
                    full_name: fullName,
                    phone: phone,
                    email: email,
                    address: address,
                    booking_date: bookingDate,
                    booking_time: bookingTime,
                    duration: duration,
                    service: selectedService.name,
                    therapist: selectedTherapist.name,
                    payment_method: paymentMethod,
                    total: currentTotal,
                    deposit: currentDeposit,
                    status: 'Pending'
                };

                const { data, error } = await supabase
                    .from('bookings')
                    .insert([payload])
                    .select();

                setIsSubmitting(false);

                if (error) {
                    alert('Error saving booking to database: ' + error.message);
                } else {
                    const createdBooking = data[0];
                    setBookingDetails({
                        id: 'DB-' + createdBooking.id,
                        fullName, phone, email, address,
                        date: bookingDate, time: bookingTime,
                        duration, service: selectedService.name,
                        therapist: selectedTherapist.name,
                        paymentMethod, total: currentTotal, deposit: currentDeposit
                    });
                    setView('confirmation');
                }
            };

            // Update Status in Supabase
            const updateBookingStatus = async (id, newStatus) => {
                const { error } = await supabase
                    .from('bookings')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) {
                    alert('Failed to update status: ' + error.message);
                } else {
                    fetchBookings();
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <div className="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold font-serif tracking-wider text-xl">PE</div>
                            <div>
                                <h1 className="font-serif text-lg tracking-wide text-amber-400 font-bold">WELCOME TO A PERSONALIZED EXPERIENCE</h1>
                                <p className="text-xs text-slate-400 uppercase tracking-widest">Luxury Mobile Spa & Wellness</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button onClick={() => setView('home')} className={`text-sm font-medium transition ${view === 'home' ? 'text-amber-400' : 'text-slate-300 hover:text-white'}`}>Home</button>
                            <button onClick={() => setView('booking')} className="bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-2 rounded-lg text-sm font-semibold transition">Book Session</button>
                            <button onClick={() => setView('admin')} className="text-slate-400 hover:text-amber-400 text-xs uppercase tracking-wider border border-slate-700 px-3 py-1.5 rounded-lg">Owner Admin</button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1">
                        {/* HOME VIEW */}
                        {view === 'home' && (
                            <div>
                                <div className="relative bg-gradient-to-b from-slate-900 to-slate-950 py-24 px-6 text-center border-b border-slate-800">
                                    <div className="max-w-3xl mx-auto space-y-6">
                                        <span className="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-widest border border-amber-500/20">Exquisite Private Treatments</span>
                                        <h1 className="font-serif text-4xl md:text-6xl font-bold tracking-tight text-white">Indulge in Ultimate Relaxation</h1>
                                        <p className="text-slate-400 text-lg max-w-xl mx-auto">Experience bespoke wellness therapy delivered directly to your private sanctuary by professional licensed specialists.</p>
                                        <div className="pt-4 flex justify-center space-x-4">
                                            <button onClick={() => setView('booking')} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-8 py-3.5 rounded-xl shadow-lg transition">Book Your Experience Now</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="max-w-7xl mx-auto px-6 py-16">
                                    <div className="text-center mb-12">
                                        <h2 className="font-serif text-3xl font-bold text-white mb-2">Our Signature Services</h2>
                                        <p className="text-slate-400">Select any treatment for customization and instant booking.</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {services.filter(s => s.active).map(srv => (
                                            <div key={srv.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-amber-500/50 transition flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <span className="bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-md font-medium">{srv.tag}</span>
                                                        <span className="text-2xl font-bold font-serif text-amber-400">${srv.basePrice}<span className="text-xs text-slate-400 font-sans font-normal"> base</span></span>
                                                    </div>
                                                    <h3 className="font-serif text-xl font-bold text-white mb-2">{srv.name}</h3>
                                                    <p className="text-slate-400 text-sm mb-6">Tailored pressure points, premium aromatic oils, and expert therapeutic execution.</p>
                                                </div>
                                                <button onClick={() => { setSelectedService(srv); setView('booking'); }} className="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 py-3 rounded-xl font-medium transition">
                                                    Select & Configure
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BOOKING FLOW */}
                        {view === 'booking' && (
                            <div className="max-w-4xl mx-auto px-6 py-12">
                                <div className="mb-8">
                                    <h2 className="font-serif text-3xl font-bold text-white mb-2">Secure Your Booking</h2>
                                    <p className="text-slate-400">Fill out your preferences below. A 50% deposit is required to confirm all appointments.</p>
                                </div>

                                <form onSubmit={handleBookingSubmit} className="space-y-8 bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                                    <div>
                                        <label className="block text-sm font-semibold text-amber-400 uppercase tracking-wider mb-3">1. Choose Service</label>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {services.filter(s => s.active).map(srv => (
                                                <div key={srv.id} onClick={() => setSelectedService(srv)} className={`p-4 rounded-xl border cursor-pointer transition flex justify-between items-center ${selectedService.id === srv.id ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-950'}`}>
                                                    <div>
                                                        <p className="font-semibold text-white">{srv.name}</p>
                                                        <p className="text-xs text-slate-400">${srv.basePrice} base rate</p>
                                                    </div>
                                                    <input type="radio" checked={selectedService.id === srv.id} onChange={() => {}} className="text-amber-500 focus:ring-amber-500" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-amber-400 uppercase tracking-wider mb-3">2. Select Duration</label>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {Object.keys(multipliers).map(min => (
                                                <div key={min} onClick={() => setDuration(min)} className={`p-4 rounded-xl border text-center cursor-pointer transition ${duration === min ? 'border-amber-500 bg-amber-500/10 text-amber-400' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                                                    <p className="text-lg font-bold">{min} Mins</p>
                                                    <p className="text-xs text-slate-400">{multipliers[min]}x multiplier</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-amber-400 uppercase tracking-wider mb-3">3. Preferred Therapist</label>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {therapists.filter(t => t.active).map(t => (
                                                <div key={t.id} onClick={() => setSelectedTherapist(t)} className={`p-4 rounded-xl border cursor-pointer transition flex items-center space-x-4 ${selectedTherapist?.id === t.id ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-950'}`}>
                                                    <img src={t.avatar} alt={t.name} className="w-12 h-12 rounded-full object-cover border border-amber-500/30" />
                                                    <div>
                                                        <p className="font-semibold text-white text-sm">{t.name}</p>
                                                        <p className="text-xs text-slate-400">Available</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                                            <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} placeholder="John Doe" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Phone Number</label>
                                            <input type="tel" required value={phone} onChange={e => setPhone(e.target.value)} placeholder="+1 (555) 000-0000" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                                            <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="john@example.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Location / Address</label>
                                            <input type="text" required value={address} onChange={e => setAddress(e.target.value)} placeholder="Hotel Room 402 or Home Address" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Appointment Date</label>
                                            <input type="date" required value={bookingDate} onChange={e => setBookingDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Appointment Time</label>
                                            <input type="time" required value={bookingTime} onChange={e => setBookingTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-amber-400 uppercase tracking-wider mb-3">5. Select Payment Method</label>
                                        <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                                            {paymentMethods.filter(p => p.active).map(p => (
                                                <option key={p.id} value={p.name}>{p.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-4">
                                        <div className="flex justify-between text-slate-300">
                                            <span>Service: {selectedService.name} ({duration} mins)</span>
                                            <span>${currentTotal}</span>
                                        </div>
                                        <div className="flex justify-between text-amber-400 font-bold text-lg border-t border-slate-800 pt-3">
                                            <span>Required 50% Deposit:</span>
                                            <span>${currentDeposit}</span>
                                        </div>
                                        <label className="flex items-center space-x-3 pt-2 cursor-pointer">
                                            <input type="checkbox" required checked={agreedDeposit} onChange={e => setAgreedDeposit(e.target.checked)} className="w-5 h-5 text-amber-500 rounded bg-slate-900 border-slate-700" />
                                            <span className="text-xs text-slate-300">I agree to the non-refundable 50% deposit policy (${currentDeposit}) to secure my appointment.</span>
                                        </label>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-4 rounded-xl text-lg transition shadow-xl disabled:opacity-50">
                                        {isSubmitting ? 'Saving Booking to Cloud Database...' : `Confirm Booking & Pay $${currentDeposit} Deposit`}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* CONFIRMATION VIEW */}
                        {view === 'confirmation' && bookingDetails && (
                            <div className="max-w-2xl mx-auto px-6 py-16 text-center space-y-6">
                                <div className="w-20 h-20 bg-amber-500/10 border border-amber-500 text-amber-400 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                                <h2 className="font-serif text-3xl font-bold text-white">Booking Saved to Database!</h2>
                                <p className="text-slate-400">Thank you, <strong className="text-white">{bookingDetails.fullName}</strong>. Your session for <strong className="text-amber-400">{bookingDetails.service}</strong> with <strong className="text-white">{bookingDetails.therapist}</strong> has been logged.</p>
                                
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left space-y-3">
                                    <div className="flex justify-between text-sm"><span className="text-slate-400">Booking Record ID:</span> <span className="font-mono text-amber-400">{bookingDetails.id}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-400">Date & Time:</span> <span className="text-white">{bookingDetails.date} at {bookingDetails.time}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-400">Location:</span> <span className="text-white">{bookingDetails.address}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-slate-400">Chosen Payment:</span> <span className="text-white">{bookingDetails.paymentMethod}</span></div>
                                    <div className="flex justify-between text-sm font-bold border-t border-slate-800 pt-2"><span className="text-slate-300">Deposit Due:</span> <span className="text-amber-400">${bookingDetails.deposit}</span></div>
                                </div>
                                <button onClick={() => setView('home')} className="bg-slate-800 hover:bg-slate-700 text-white px-8 py-3 rounded-xl font-medium transition">Return to Home</button>
                            </div>
                        )}

                        {/* OWNER ADMIN PANEL */}
                        {view === 'admin' && (
                            <div className="max-w-6xl mx-auto px-6 py-12">
                                {!isAdminLoggedIn ? (
                                    <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6">
                                        <div className="text-center">
                                            <h2 className="font-serif text-2xl font-bold text-white mb-2">Owner Admin Login</h2>
                                            <p className="text-xs text-slate-400">Access live cloud bookings database.</p>
                                        </div>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            if (passwordInput === adminPassword) {
                                                setIsAdminLoggedIn(true);
                                            } else {
                                                alert('Invalid Admin Password');
                                            }
                                        }} className="space-y-4">
                                            <div className="relative">
                                                <input type={showPassword ? "text" : "password"} placeholder="Enter Admin Password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-xs text-amber-400">{showPassword ? "Hide" : "Show"}</button>
                                            </div>
                                            <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">Unlock Dashboard</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="space-y-8">
                                        <div className="flex justify-between items-center border-b border-slate-800 pb-6">
                                            <div>
                                                <h2 className="font-serif text-3xl font-bold text-white">Live Supabase Bookings</h2>
                                                <p className="text-slate-400 text-sm">Real-time bookings synchronized with your cloud database.</p>
                                            </div>
                                            <div className="flex space-x-3">
                                                <button onClick={fetchBookings} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-medium">Refresh Data</button>
                                                <button onClick={() => setIsAdminLoggedIn(false)} className="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-xl text-sm font-medium">Lock Panel</button>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                            {loadingBookings ? (
                                                <p className="text-center text-slate-400 py-8">Fetching live database records...</p>
                                            ) : bookings.length === 0 ? (
                                                <p className="text-center text-slate-400 py-8">No bookings found in database yet. Submit a test booking on the live site!</p>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left text-sm">
                                                        <thead className="border-b border-slate-800 text-slate-400 uppercase text-xs">
                                                            <tr>
                                                                <th className="pb-3">Client Contact</th>
                                                                <th className="pb-3">Service & Timing</th>
                                                                <th className="pb-3">Therapist</th>
                                                                <th className="pb-3">Payment</th>
                                                                <th className="pb-3">Database Status</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800">
                                                            {bookings.map(b => (
                                                                <tr key={b.id} className="hover:bg-slate-950/50">
                                                                    <td className="py-4">
                                                                        <p className="font-semibold text-white">{b.full_name}</p>
                                                                        <p className="text-xs text-slate-400">{b.phone}</p>
                                                                        <p className="text-xs text-slate-500">{b.address}</p>
                                                                    </td>
                                                                    <td className="py-4">
                                                                        <p className="text-white">{b.service} ({b.duration}m)</p>
                                                                        <p className="text-xs text-slate-400">{b.booking_date} at {b.booking_time}</p>
                                                                    </td>
                                                                    <td className="py-4 text-slate-300">{b.therapist}</td>
                                                                    <td className="py-4">
                                                                        <p className="text-amber-400 font-bold">${b.deposit} deposit</p>
                                                                        <p className="text-xs text-slate-400">Total: ${b.total} ({b.payment_method})</p>
                                                                    </td>
                                                                    <td className="py-4">
                                                                        <select value={b.status} onChange={e => updateBookingStatus(b.id, e.target.value)} className="bg-slate-950 border border-slate-800 text-xs text-amber-400 rounded-lg px-2 py-1">
                                                                            <option value="Pending">Pending</option>
                                                                            <option value="Confirmed">Confirmed</option>
                                                                            <option value="Completed">Completed</option>
                                                                            <option value="Cancelled">Cancelled</option>
                                                                        </select>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800 py-6 px-6 text-center text-xs text-slate-500">
                        &copy; 2026 WELCOME TO A PERSONALIZED EXPERIENCE. All rights reserved. Luxury Private Wellness.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
